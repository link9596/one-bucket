<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="shortcut icon" sizes="128x128" href="https://link9596.github.io/one-bucket/favicon.svg">
  <title>OneBucket</title>
  <style>
    :root {
      --bg-body: #f5f7fb;
      --bg-card: #ffffff;
      --bg-path: #f1f5f9;
      --bg-input: #ffffff;
      --bg-table-header: #f8fafc;
      --bg-progress: #f1f5f9;
      --text-primary: #1e293b;
      --text-secondary: #475569;
      --text-muted: #64748b;
      --border-light: #e2e8f0;
      --border-table: #eef2f6;
      --btn-primary: #3b82f6;
      --btn-primary-hover: #2563eb;
      --btn-upload: #10b981;
      --btn-upload-hover: #059669;
      --btn-danger: #ff6161;
      --btn-danger-hover: #f65555;
      --btn-success: #10b981;
      --btn-success-hover: #059669;
      --btn-purple: #8b5cf6;
      --btn-purple-hover: #7c3aed;
      --btn-gray: #64748b;
      --btn-gray-hover: #475569;
      --link-color: #2563eb;
      --progress-bg: #e2e8f0;
      --progress-fill: linear-gradient(90deg, #3b82f6, #60a5fa);
      --copy-btn-bg: #e0e7ff;
      --copy-btn-color: #3730a3;
      --download-btn-bg: #e6f0ff;
      --download-btn-color: #1d4ed8;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 20px rgba(0, 0, 0, 0.05);
      --toast-bg: #1e293b;
      --toast-color: #ffffff;
      --scroll-bar:#c4cbd5;
      --scroll-bar-hover:#a0aab9;
      --star-default: #FCD53F;
      --star-muted: #9ca3af;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-body: #0f172a;
        --bg-card: #1e293b;
        --bg-path: #334155;
        --bg-input: #334155;
        --bg-table-header: #334155;
        --bg-progress: #334155;
        --text-primary: #f1f5f9;
        --text-secondary: #cbd5e1;
        --text-muted: #94a3b8;
        --border-light: #475569;
        --border-table: #334155;
        --btn-primary: #3b82f666;
        --btn-primary-hover: #60a5fa;
        --btn-upload: #10b981;
        --btn-upload-hover: #34d399;
        --btn-danger: #ff6161;
        --btn-danger-hover: #f65555;
        --btn-success: #10b981;
        --btn-success-hover: #34d399;
        --btn-purple: #8b5cf652;
        --btn-purple-hover: #a78bfa4d;
        --btn-gray: #64748b;
        --btn-gray-hover: #94a3b8;
        --link-color: #60a5fa;
        --progress-bg: #475569;
        --progress-fill: linear-gradient(90deg, #60a5fa, #93c5fd);
        --copy-btn-bg: #4c1d95;
        --copy-btn-color: #c4b5fd;
        --download-btn-bg: #1e3a8a;
        --download-btn-color: #93c5fd;
        --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
        --shadow-md: 0 4px 20px rgba(0, 0, 0, 0.3);
        --toast-bg: #0f172a;
        --toast-color: #f1f5f9;
        --scroll-bar:#3a495f;
        --scroll-bar-hover:#556883;
        --star-default: #FCD53F;
        --star-muted: #6b7280;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg-body);
      padding: 16px;
      min-height: 100vh;
      transition: background-color 0.3s ease;
    }

    /* 全局滚动条样式 */
    html {
      scrollbar-width: thin;
      scrollbar-color: var(--scroll-bar) transparent;
    }

    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
      background: transparent;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
      border-radius: 2px;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--scroll-bar);
      border-radius: 2px;
      transition: background 0.2s;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--scroll-bar-hover);
    }

    ::-webkit-scrollbar-corner {
      background: transparent;
    }

    .wrap {
      max-width: 1200px;
      margin: 0 auto;
      background: var(--bg-card);
      border-radius: 20px;
      box-shadow: var(--shadow-md);
      padding: 20px 16px;
      display: none;
      transition: background-color 0.3s ease;
      opacity: 0;
      transform: translateY(20px);
    }
    .wrap.visible {
      opacity: 1;
      transform: translateY(0);
      transition: opacity 0.5s ease, transform 0.5s ease;
    }

    h2 { font-size: 1.5rem; margin-bottom: 16px; color: var(--text-primary); }

    .top-bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 20px; }
    @media (max-width: 640px) {
      .top-bar input[type="text"], .top-bar input[type="file"] { flex: 1 1 100%; width: 100%; }
      .top-bar button { flex: 1 1 auto; }
    }

    .path-bar {
      background: var(--bg-path); padding: 10px 12px; border-radius: 12px; margin-bottom: 16px;
      font-size: 0.9rem; word-break: break-all; overflow-x: auto; white-space: nowrap;
      -webkit-overflow-scrolling: touch;
    }
    .path-bar a { color: var(--link-color); text-decoration: none; margin: 0 2px; cursor: pointer; }

    .status-bar { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
    .tip { font-size: 0.8rem; color: var(--text-secondary); background: var(--bg-progress); padding: 8px 12px; border-radius: 20px; }
    
    /* 刷新按钮样式 */
    .refresh-btn { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 50%; background: var(--bg-progress); border: none; cursor: pointer; color: var(--text-secondary); transition: all 0.2s; padding:0px;}
    .refresh-btn:hover { background: var(--border-light); color: var(--text-primary); }
    .refresh-btn:active { transform: rotate(180deg); }
    .refresh-btn svg { width: 18px; height: 18px; }
    
    .operate-btn { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 50%; background: var(--bg-progress); border: none; cursor: pointer; color: var(--text-secondary); transition: all 0.2s; padding:0px;}
    .operate-btn:hover { background: var(--border-light); color: var(--text-primary); }
    .operate-btn svg { width: 18px; height: 18px; }
    /* 批量删除按钮额外样式 */
    .batch-del-btn {
      color: var(--text-muted);
      cursor: not-allowed;
      opacity: 0.5;
    }
    .batch-del-btn.active {
      background-color: #ff7878;
      color: #fff;
      cursor: pointer;
      opacity: 1;
    }
    .batch-del-btn.active:hover {
      background-color: #ffa0a0;
    }

    input, button {
      padding: 10px 14px; border-radius: 12px; font-size: 0.9rem; border: 1px solid var(--border-light);
      background: var(--bg-input); color: var(--text-primary); transition: all 0.2s;
    }
    input:focus { outline: none; border-color: var(--btn-primary); box-shadow: 0 0 0 2px rgba(59,130,246,0.2); }
    input::placeholder { color: var(--text-muted); }
    button { background: var(--btn-primary); color: white; border: none; font-weight: 500; cursor: pointer; box-shadow: var(--shadow-sm); }
    button:active { transform: scale(0.97); }
    .upload-btn { background: var(--btn-upload); } .upload-btn:hover { background: var(--btn-upload-hover); }
    .del-btn { background: var(--btn-danger); } .del-btn:hover { background: var(--btn-danger-hover); }
    .mkdir-btn { background: var(--btn-success); } .mkdir-btn:hover { background: var(--btn-success-hover); }
    .export-btn { background: var(--btn-purple); } .export-btn:hover { background: var(--btn-purple-hover); }

    .upload-progress-container { background: var(--bg-progress); border-radius: 15px; padding: 12px 16px; margin-top: 10px; margin-bottom: 10px; display: none; flex-direction: column; gap: 8px; }
    .progress-item { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .file-label { font-size: 0.8rem; color: var(--text-primary); width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .progress-bar-bg { flex: 1; height: 8px; background-color: var(--progress-bg); border-radius: 10px; overflow: hidden; }
    .progress-bar-fill { width: 0%; height: 100%; background: var(--progress-fill); border-radius: 10px; transition: width 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1); }
    .progress-bar-fill.uploading { background-image: repeating-linear-gradient(45deg, rgba(96,165,250,1) 0px, rgba(96,165,250,1) 10px, rgba(255,255,255,1) 10px, rgba(255,255,255,1) 20px); background-size: 28px 100%; animation: moveStripes 0.8s linear infinite; }
    @keyframes moveStripes { 0% { background-position: 0 0; } 100% { background-position: 28px 0; } }
    .progress-percent { font-size: 0.8rem; color: var(--text-primary); min-width: 45px; text-align: right; }
    .upload-status-icon { width: 20px; text-align: center; }
    .pulse-dot { display: inline-block; width: 10px; height: 10px; background-color: var(--btn-primary); border-radius: 50%; animation: pulse 1.2s infinite; }
    @keyframes pulse { 0% { opacity: 0.4; transform: scale(0.8); } 70% { opacity: 1; transform: scale(1.2); } 100% { opacity: 0.4; transform: scale(0.8); } }

    .table-wrapper { overflow-x: auto; -webkit-overflow-scrolling: touch; margin-top: 12px; border-radius: 16px; border: 1px solid var(--border-table); }
    table { width: 100%; border-collapse: collapse; min-width: 550px; }
    th, td { padding: 12px 10px; text-align: left; border-bottom: 1px solid var(--border-table); font-size: 0.85rem; vertical-align: middle; color: var(--text-primary); }
    th { background: var(--bg-table-header); font-weight: 600; }
    td:first-child, th:first-child { word-break: break-word; max-width: 180px; }
    @media (max-width: 640px) { td:first-child, th:first-child { max-width: 240px; min-width: 160px; } }
    td:first-child a { display: inline-block; vertical-align: middle; line-height: 1.4; color: var(--link-color); text-decoration: none; cursor: pointer; }
    td:first-child span { display: inline-block; vertical-align: middle; line-height: 1.4; color: var(--text-primary); cursor: pointer; }
    td:last-child { white-space: nowrap; }
    td button, td a { display: inline-block; padding: 6px 10px; margin: 0 4px 4px 0; font-size: 0.75rem; border-radius: 20px; text-decoration: none; border: none; cursor: pointer; transition: all 0.2s; }
    td a { background: var(--download-btn-bg); color: var(--download-btn-color); }
    td button.copy-btn { background: var(--copy-btn-bg); color: var(--copy-btn-color); }
    td button.del-btn { background: var(--btn-danger); color: white; }
    td button.del-btn:hover { background: var(--btn-danger-hover); }

    /* 选中行高亮 */
    tr.selected {
      background: var(--bg-progress) !important;
    }

    .login-box { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; backdrop-filter: blur(4px); z-index: 100; }
    .login-inner { background: var(--bg-card); padding: 28px 24px; border-radius: 32px; width: 90%; max-width: 340px; text-align: center; box-shadow: var(--shadow-md); }
    .login-inner h3 { font-size: 1.6rem; margin-bottom: 20px; color: var(--text-primary); }
    .login-inner input { width: 100%; padding: 14px; margin-bottom: 16px; border-radius: 40px; border: 1px solid var(--border-light); background: var(--bg-input); color: var(--text-primary); font-size: 1rem; }
    .login-inner button { width: 100%; padding: 12px; background: var(--btn-primary); font-size: 1rem; border-radius: 40px; }
    #loginTip { margin-top: 12px; font-size: 0.8rem; color: var(--btn-danger); }

    .empty-row td { text-align: center; color: var(--text-muted); padding: 40px; }
    .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: var(--toast-bg); color: var(--toast-color); padding: 8px 18px; border-radius: 40px; font-size: 0.8rem; z-index: 9999; opacity: 0; transition: opacity 0.2s; pointer-events: none; }

    /* 模态框公用 */
    .modal-overlay {
      display: flex; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.6); z-index: 300; align-items: center; justify-content: center;
      opacity: 0; visibility: hidden; pointer-events: none;
      transition: opacity 0.3s ease, visibility 0.3s;
    }
    .modal-overlay.active { opacity: 1; visibility: visible; pointer-events: auto; }
    .modal-content {
      background: var(--bg-card); border-radius: 16px; width: 90%; max-width: 800px; padding: 20px;
      box-shadow: var(--shadow-md); max-height: 90vh; overflow-y: auto;
      transform: scale(0.9); transition: transform 0.3s ease;
    }
    .modal-overlay.active .modal-content { transform: scale(1); }
    .modal-content h3 { color: var(--text-primary); margin-bottom: 10px; }
    .modal-actions { margin-top: 15px; display: flex; gap: 10px; justify-content: flex-end; border-top: 1px solid var(--border-light); padding-top: 15px; }

    /* 桶配置表单网格 */
    .bucket-config-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    @media (max-width: 768px) {
      .bucket-config-grid { grid-template-columns: 1fr; }
      .bucket-config-grid > * { grid-column: span 1 !important; }
      .usage-grid { grid-template-columns: 1fr !important; }
    }

    /* 全屏加载动画覆盖层 */
    .loading-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: #1e293b; display: flex; align-items: center; justify-content: center;
      z-index: 999; flex-direction: column; transition: opacity 0.4s ease; opacity: 1;
    }
    .loading-overlay.fade-out { opacity: 0; pointer-events: none; }
    .loading-brand { display: flex; align-items: center; gap: 12px; margin-bottom: 30px; }
    .loading-brand svg { width: 48px; height: 48px; fill: #ffffff; }
    .loading-brand span { font-size: 2rem; font-weight: 700; color: #ffffff; }
    .loading-dots svg { width: 32px; height: 32px; fill: #ffffff; color: #ffffff; }

    /* 自定义桶选择下拉 */
    .custom-select { position: relative; flex: 1; min-width: 150px; user-select: none; }
    .custom-select-trigger { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--border-light); background: var(--bg-input); color: var(--text-primary); cursor: pointer; transition: border-color 0.2s, box-shadow 0.2s; }
    .custom-select-trigger:hover { border-color: var(--btn-primary); }
    .custom-select-trigger .arrow { width: 12px; height: 12px; transition: transform 0.2s; }
    .custom-select.open .arrow { transform: rotate(180deg); }
    .custom-select-options { position: absolute; top: calc(100% + 4px); left: 0; right: 0; background: var(--bg-card); border-radius: 12px; border: 1px solid var(--border-light); box-shadow: var(--shadow-md); overflow: hidden; max-height: 0; opacity: 0; transform: scaleY(0.8); transform-origin: top center; transition: max-height 0.25s ease, opacity 0.25s ease, transform 0.25s ease; z-index: 500; }
    .custom-select.open .custom-select-options { max-height: 300px; opacity: 1; transform: scaleY(1); }
    .custom-select-option { padding: 10px 14px; cursor: pointer; transition: background-color 0.15s; color: var(--text-primary); font-size: 0.9rem; }
    .custom-select-option:hover { background: var(--bg-progress); }
    .custom-select-option.selected { background: var(--bg-progress); font-weight: 600; }

    /* 桶卡片列表样式 */
    .bucket-card-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 15px; padding:5px;}
    @media (max-width: 480px) { .bucket-card-list { grid-template-columns: 1fr; } }
    .bucket-card {
      background: var(--bg-card); border: 1px solid var(--border-light); border-radius: 12px;
      padding: 16px; cursor: pointer; transition: transform 0.15s, box-shadow 0.15s;
      position: relative; min-height: 120px; display: flex; flex-direction: column;
    }
    .bucket-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
    .bucket-card .card-header { display: flex; justify-content: space-between; align-items: flex-start; }
    .bucket-card .card-title { font-size: 1.1rem; font-weight: 600; color: var(--text-primary); }
    .bucket-card .card-bucket-name { font-size: 0.8rem; color: var(--text-muted); margin-top: 4px; }
    .bucket-card .card-domain { font-size: 0.75rem; color: var(--text-secondary); margin-top: 4px; word-break: break-all; }
    .bucket-card .card-footer { margin-top: auto; display: flex; justify-content: space-between; align-items: flex-end; }
    .bucket-card .card-usage { font-size: 0.75rem; color: var(--text-secondary); }
    .bucket-card .delete-icon {
      position: absolute; bottom: 10px; right: 15px; background: none; border: none; cursor: pointer;
      color: var(--text-muted); transition: color 0.2s; padding: 4px; box-shadow: none;
    }
    .bucket-card .delete-icon:hover { color: var(--btn-danger); }

    /* 默认桶星星按钮 */
    .set-default-btn {
      background: none;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--star-muted);
      transition: color 0.2s, transform 0.2s;
      box-shadow: none;
      padding: 0px;
    }
    .set-default-btn:hover {
      color: var(--star-default);
      transform: scale(1.1);
    }
    .set-default-btn.is-default {
      color: var(--star-default);
    }
    .set-default-btn svg {
      width: 20px;
      height: 20px;
    }

    /* 添加桶卡片样式 */
    .add-bucket-card {
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border: 2px dashed var(--border-light);
      background: transparent;
      color: var(--text-muted);
      font-size: 2rem;
      min-height: 120px;
      transition: all 0.2s;
    }
    .add-bucket-card:hover {
      border-color: var(--btn-primary);
      color: var(--btn-primary);
      background: var(--bg-progress);
    }

    /* 登录历史表格 */
    .history-table-wrapper {
      max-height: 300px;
      overflow-y: auto;
      margin-top: 10px;
    }

    /* UA 单元格滚动 */
    .ua-cell {
      display: flex;
      align-items: center;
      gap: 4px;
      max-width: 250px;
    }
    .ua-text {
      overflow-x: auto;
      white-space: nowrap;
      max-width: 180px;
      scrollbar-width: thin;
    }
    
    .copy-ua-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      padding: 0;
      display: inline-flex;
      align-items: center;
      flex-shrink: 0;
      box-shadow: none;
    }
    .copy-ua-btn:hover {
      color: var(--btn-primary);
    }

    /* 文件列表过渡 */
    #fileList { transition: opacity 0.2s ease; }
    #fileList.fade-out { opacity: 0; }

    /* 非线性动画 */
    .bucket-view {
      transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.4s ease;
    }
    #bucketViewContainer {
      transition: height 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* 初始化密码 */
    #initPwdBtn {
      background: none;
      border: none;
      color: var(--link-color);
      cursor: pointer;
      text-decoration: underline;
      font-size: 0.8rem;
      margin-top: 5px;
      box-shadow: none;
      padding: 5px;
    }

    /* 视图容器定位 */
    #bucketViewContainer {
      position: relative;
      overflow: hidden;
    }
    .bucket-view {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      opacity: 0;
      pointer-events: none;
      transform: translateX(100%);
    }
    .bucket-view.active {
      position: relative;
      transform: translateX(0);
      opacity: 1;
      pointer-events: auto;
    }
    .bucket-view.inactive-left {
      transform: translateX(-100%);
      opacity: 0;
      pointer-events: none;
    }
    .bucket-view.inactive-right {
      transform: translateX(100%);
      opacity: 0;
      pointer-events: none;
    }

    /* 字段标签样式 */
    .form-field {
      display: flex;
      flex-direction: column;
    }
    .form-field label {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin: 4px;
      font-weight: 500;
    }

    /* 底部按钮左右分布 */
    .footer-actions {
      justify-content: space-between !important;
    }
  </style>
</head>
<body>

<!-- 全屏加载动画覆盖层 -->
<div class="loading-overlay" id="loadingOverlay">
  <div class="loading-brand">

<!-- 编辑器弹窗 -->
<div id="editorModal" class="modal-overlay">
  <div class="modal-content">
    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;">

        编辑文件：
        <span id="editorFileName" onclick="openRenameFromEditor()" style="cursor:pointer; text-decoration:underline dotted; text-underline-offset:3px;" title="点击重命名"></span>

          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" width="1em" height="1em"><path fill="currentColor" d="M10 6.5V2H5.5A1.5 1.5 0 0 0 4 3.5v13A1.5 1.5 0 0 0 5.5 18h2.721c-.21-.39-.285-.86-.164-1.347l.375-1.498a3.2 3.2 0 0 1 .84-1.485l4.83-4.83A2.86 2.86 0 0 1 16 8.004V8h-4.5A1.5 1.5 0 0 1 10 6.5m1 0V2.25L15.75 7H11.5a.5.5 0 0 1-.5-.5m6.454 3.048a1.87 1.87 0 0 0-2.645 0l-4.83 4.83a2.2 2.2 0 0 0-.577 1.02l-.375 1.498a.89.89 0 0 0 1.079 1.078l1.498-.374a2.2 2.2 0 0 0 1.02-.578l4.83-4.83a1.87 1.87 0 0 0 0-2.644"/></svg>

    <div class="modal-actions">
      <button onclick="closeEditor()" style="background:var(--btn-gray);">取消</button>
      <button onclick="saveEditor()" style="background:var(--btn-primary);">保存</button>
    </div>
  </div>
</div>

<!-- 重命名弹窗 -->
<div id="renameModal" class="modal-overlay">
  <div class="modal-content" style="max-width:400px;">
    <h3 style="margin-bottom:10px; color:var(--text-primary);">重命名</h3>
    <p style="margin-bottom:10px; color:var(--text-secondary);">当前名称：<span id="renameOldName"></span></p>
    <input type="text" id="renameInput" style="width:100%; padding:10px; border-radius:8px; border:1px solid var(--border-light); background:var(--bg-input); color:var(--text-primary);" placeholder="输入新名称">
    <div class="modal-actions">
      <button onclick="closeRename()" style="background:var(--btn-gray);">取消</button>
      <button onclick="submitRename()" style="background:var(--btn-primary);">确定</button>
    </div>
  </div>
</div>

<!-- 新建文件夹弹窗 -->
<div id="newFolderModal" class="modal-overlay">
  <div class="modal-content" style="max-width:400px;">
    <h3 style="margin-bottom:10px; color:var(--text-primary);">新建文件夹</h3>
    <input type="text" id="newFolderInput" style="width:100%; padding:10px; border-radius:8px; border:1px solid var(--border-light); background:var(--bg-input); color:var(--text-primary);" placeholder="输入文件夹名称">
    <div class="modal-actions">
      <button onclick="closeNewFolderModal()" style="background:var(--btn-gray);">取消</button>
      <button onclick="submitNewFolder()" style="background:var(--btn-primary);">确定</button>
    </div>
  </div>
</div>

<!-- 桶管理弹窗 -->
<div id="bucketManagerModal" class="modal-overlay">
  <div class="modal-content" style="max-width:900px;">
    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:15px;">
      <h3 id="bucketManagerTitle">📦 桶列表</h3>
    </div>

    <!-- 视图容器：用于滑动动画 -->
    <div id="bucketViewContainer">
      <!-- 一级视图：桶卡片列表 -->
      <div id="bucketListView" class="bucket-view active">
        <div class="bucket-card-list" id="bucketCardList"></div>
        <!-- 底部按钮：账户管理在左，关闭在右 -->
        <div class="modal-actions footer-actions">
          <button onclick="showAccountView()" style="background:var(--btn-primary);">🔐 账户管理</button>
          <button onclick="closeBucketManager()" style="background:var(--btn-gray);">关闭</button>
        </div>
      </div>

      <!-- 二级视图：桶详情表单 -->
      <div id="bucketDetailView" class="bucket-view inactive-right">
        <div id="bucketConfigList" style="display:flex; flex-direction:column; gap:15px;"></div>
        <div class="modal-actions">
          <button onclick="showBucketList()" style="background:var(--btn-gray);">返回</button>
          <button onclick="saveBucketConfigs()" style="background:var(--btn-primary);">保存配置</button>
        </div>
      </div>

      <!-- 三级视图：账户管理 -->
      <div id="accountView" class="bucket-view inactive-right">
        <h4 style="margin-bottom:10px;color:var(--text-primary);">修改密码</h4>
        <div style="display:flex; gap:10px; flex-wrap:wrap; margin-bottom:20px;">
          <input type="password" id="oldPwdInput" placeholder="旧密码" style="flex:1; min-width:150px;">
          <input type="password" id="newPwdInput" placeholder="新密码（至少6位）" style="flex:1; min-width:150px;">
          <button onclick="submitChangePwd()" style="background:var(--btn-primary);">确认修改</button>
        </div>
        <h4 style="margin-bottom:10px;color:var(--text-primary);">已登录设备</h4>
        <div class="history-table-wrapper">
          <table>
            <thead><tr><th>登录时间</th><th>IP</th><th>User-Agent</th><th>操作</th></tr></thead>
            <tbody id="loginHistoryList"></tbody>
          </table>
        </div>
        <div class="modal-actions">
          <button onclick="showBucketList()" style="background:var(--btn-gray);">返回</button>
          <button onclick="closeBucketManager()" style="background:var(--btn-gray);">关闭</button>
        </div>
      </div>
    </div>
  </div>
</div>

  var navLang = navigator.language || navigator.userLanguage || 'en';
  return navLang.indexOf('zh') === 0 ? 'zh' : 'en';
})();

// 翻译函数
function t(key) {
  var str = i18n[lang][key];
  if (!str) return key;
  var args = Array.prototype.slice.call(arguments, 1);
  for (var i = 0; i < args.length; i++) {
    str = str.replace(new RegExp('\\{' + i + '\\}', 'g'), args[i]);
  }
  return str;
}

function translateBackendMsg(originalMsg) {
  if (!originalMsg) return '';
  if (backendMsgMap[originalMsg]) {
    return t(backendMsgMap[originalMsg]);
  }
  for (var cnKey in backendMsgMap) {
    if (originalMsg.indexOf(cnKey) !== -1) {
      var value = t(backendMsgMap[cnKey]);
      if (value.indexOf('{0}') !== -1) {
        var match = originalMsg.match(/\d+/);
        if (match) {
          return t(backendMsgMap[cnKey], match[0]);
        }
      }
      return value;
    }
  }
  return originalMsg;
}

function showToast(msg) {

  setTimeout(function() { toast.style.opacity = "0"; }, 2000);

function formatSize(b) {
  if (b == null) return '';
  if (b < 1024) return b + " B";
  if (b < 1048576) return (b / 1024).toFixed(2) + " KB";
  return (b / 1048576).toFixed(2) + " MB";
}

function escapeHtml(str) {
  if (!str) return "";
  return str.replace(/[&<>]/g, function(m) {
    if (m === '&') return '&amp;';
    if (m === '<') return '&lt;';
    if (m === '>') return '&gt;';
    return m;
  });
}

function renderBread(path) {
  var box = document.getElementById("pathHtml");
  var html = '<a onclick="getFileList(\'\')">' + t('rootPath') + '</a>';
  if (path === "") { box.innerHTML = html; return; }
  var arr = [];
  var temp = "";
  path.split("/").filter(function(s) { return s; }).forEach(function(name) {
    temp += name + "/";
    arr.push({ name: name, full: temp });
  });
  arr.forEach(function(item) {
    html += ' / <a onclick="getFileList(\'' + item.full + '\')">' + escapeHtml(item.name) + '</a>';
  });
  box.innerHTML = html;
}

function fetchWithCreds(url, options) {
  options = options || {};
  return fetch(url, {
    ...options,
    credentials: 'include',
    headers: {
      'Content-Type': 'application/json',
      ...(options.headers || {})
    }
  });
}

// ---------- 桶相关 ----------
async function fetchAllBucketUsages() {
  var promises = bucketsConfig.map(async function(b) {
    if (!b.accountId || !b.hasToken) {
      bucketSizes[b.id] = null;
      return;
    }
    try {
      var res = await fetchWithCreds('/usage?bucketId=' + b.id);
      var json = await res.json();
      if (json.code === 200 && json.size != null) {
        bucketSizes[b.id] = json.size;
      } else {
        bucketSizes[b.id] = null;
      }
    } catch (e) {
      bucketSizes[b.id] = null;
    }
  });
  await Promise.allSettled(promises);
  renderBucketOptions();
  renderBucketCardList();
  updateBucketSelectLabel();
}

function getBucketDisplayName(bucketId, bucketName) {
  var name = bucketName || bucketId;
  var size = bucketSizes[bucketId];
  if (size != null && size !== undefined) {
    name += ' (' + formatSize(size) + ')';
  }
  return name;
}

function updateBucketSelectLabel() {
  var conf = bucketsConfig.find(function(b) { return b.id === currentBucketId; });
  if (conf) {
    document.getElementById('bucketSelectLabel').innerText = getBucketDisplayName(conf.id, conf.name);
  } else {
    document.getElementById('bucketSelectLabel').innerText = t('bucketSelectNone');
  }
}

function toggleBucketDropdown() {
  var container = document.getElementById('bucketSelectContainer');
  container.classList.toggle('open');
}

function selectBucket(id) {
  currentBucketId = id;
  updateBucketSelectLabel();
  document.getElementById('bucketSelectContainer').classList.remove('open');
  document.querySelectorAll('.custom-select-option').forEach(function(opt) {
    opt.classList.toggle('selected', opt.dataset.value === id);
  });
  getFileList();
}

function renderBucketOptions() {
  var optionsContainer = document.getElementById('bucketOptions');
  optionsContainer.innerHTML = '';
  if (bucketsConfig.length === 0) {
    optionsContainer.innerHTML = '<div class="custom-select-option" style="cursor:default; color:var(--text-muted);">' + t('bucketNoConfig') + '</div>';
    return;
  }
  bucketsConfig.forEach(function(b) {
    var opt = document.createElement('div');
    opt.className = 'custom-select-option' + (b.id === currentBucketId ? ' selected' : '');
    opt.dataset.value = b.id;
    opt.innerText = getBucketDisplayName(b.id, b.name);
    opt.onclick = function() { selectBucket(b.id); };
    optionsContainer.appendChild(opt);
  });
}

document.addEventListener('click', function(event) {
  var container = document.getElementById('bucketSelectContainer');
  if (container && !container.contains(event.target)) {
    container.classList.remove('open');
  }
});

async function login() {
  var pwd = document.getElementById('pwdInput').value;
  var tipDom = document.getElementById('loginTip');
  if (!pwd) { tipDom.innerText = t('loginTipEmpty'); return; }
  try {
    var res = await fetchWithCreds('/login', {
      method: 'POST',
      body: JSON.stringify({ pwd: pwd })
    });
    var json = await res.json();
    if (json.code === 200) {
      document.getElementById('loginBox').style.display = 'none';
      var mainBox = document.getElementById('mainBox');
      mainBox.style.display = 'block';
      void mainBox.offsetWidth;
      mainBox.classList.add('visible');
      await loadBuckets();
      showToast(t('loginSuccess'));
    } else if (json.code === 503) {
      document.getElementById('initPwdBtn').style.display = 'block';
      tipDom.innerText = translateBackendMsg(json.msg) || t('loginTipInit');
    } else {
      tipDom.innerText = translateBackendMsg(json.msg) || t('loginTipFailed');
    }
  } catch (e) {
    tipDom.innerText = t('loginTipConnFailed');
    console.error(e);
  }
}

function getContainerHeight() {
  var container = document.getElementById('bucketViewContainer');
  return container.offsetHeight;
}
function setContainerHeight(height) {
  var container = document.getElementById('bucketViewContainer');
  container.style.height = height + 'px';
}
function resetContainerHeight() {
  var container = document.getElementById('bucketViewContainer');
  container.style.height = 'auto';
}

function switchView(targetView) {
  var container = document.getElementById('bucketViewContainer');
  var views = {
    list: document.getElementById('bucketListView'),
    detail: document.getElementById('bucketDetailView'),
    account: document.getElementById('accountView')
  };
  var currentViewEl = views[currentView];
  var targetViewEl = views[targetView];
  if (currentView === targetView) return;
  var startHeight = getContainerHeight();
  setContainerHeight(startHeight);
  Object.values(views).forEach(function(v) {
    v.classList.remove('active', 'inactive-left', 'inactive-right');
  });
  var toList = targetView === 'list';
  if (toList) {
    currentViewEl.classList.add('inactive-right');
    targetViewEl.classList.add('active');
  } else {
    currentViewEl.classList.add('inactive-left');
    targetViewEl.classList.add('active');
  }
  void container.offsetWidth;
  resetContainerHeight();
  setTimeout(function() {
    currentViewEl.classList.remove('inactive-left', 'inactive-right');
    currentViewEl.classList.add(toList ? 'inactive-right' : 'inactive-left');
    currentViewEl.classList.remove('active');
    targetViewEl.classList.remove('inactive-left', 'inactive-right');
    targetViewEl.classList.add('active');
    currentView = targetView;
  }, 450);
}

function showBucketList(animate) {
  animate = (animate !== undefined) ? animate : true;
  if (editingBucketIndex === -1 && editingTempBucket) {
    editingTempBucket = null;
  }
  editingBucketIndex = -1;
  editingTempBucket = null;
  document.getElementById('bucketManagerTitle').innerText = t('bucketListTitle');
  renderBucketCardList();
  if (animate && currentView !== 'list') {
    switchView('list');
  } else {
    var listView = document.getElementById('bucketListView');
    var detailView = document.getElementById('bucketDetailView');
    var accountView = document.getElementById('accountView');
    listView.classList.remove('inactive-left', 'inactive-right');
    listView.classList.add('active');
    detailView.classList.remove('active');
    detailView.classList.add('inactive-right');
    accountView.classList.remove('active');
    accountView.classList.add('inactive-right');
    resetContainerHeight();
    currentView = 'list';
  }
}

async function setDefaultBucket(id) {
  var targetBucket = bucketsConfig.find(function(b) { return b.id === id; });
  if (!targetBucket) return;
  bucketsConfig.forEach(function(b) { b.isDefault = (b.id === id); });
  try {
    var res = await fetchWithCreds('/admin/buckets', {
      method: 'POST',
      body: JSON.stringify({ data: bucketsConfig })
    });
    var json = await res.json();
    if (json.code === 200) {
      showToast(t('toastSetDefaultSuccess', targetBucket.name || id));
      renderBucketCardList();
      renderBucketOptions();
    } else {
      showToast(t('toastSetDefaultFail', translateBackendMsg(json.msg)));
    }
  } catch (e) {
    showToast(t('toastSetDefaultFail', e.message));
  }
}

function deleteBucketFromCard(index) {
  event.stopPropagation();
  if (!confirm(t('toastDeleteBucketConfirm'))) return;
  var deletedId = bucketsConfig[index].id;
  var wasDefault = bucketsConfig[index].isDefault;
  bucketsConfig.splice(index, 1);
  if (currentBucketId === deletedId) {
    currentBucketId = '';
    document.getElementById('bucketSelectLabel').innerText = t('bucketSelectNone');
    document.getElementById('fileList').innerHTML = '<tr><td colspan="4">' + t('toastNoBuckets') + '</td></tr>';
  }
  delete bucketSizes[deletedId];
  if (wasDefault && bucketsConfig.length > 0) {
    bucketsConfig[0].isDefault = true;
  }
  renderBucketCardList();
  renderBucketOptions();
  saveBucketsConfigToServer();
}

async function saveBucketConfigs() {
  var inputs = document.querySelectorAll('#bucketConfigList input[data-field]');
  var newData = {};
  inputs.forEach(function(inp) {
    newData[inp.dataset.field] = inp.value.trim();
  });
  if (!newData.id || !newData.name || !newData.endpoint || !newData.accessKeyId) {
    showToast(t('toastFieldRequired'));
    return;
  }
  var isFirstBucket = (bucketsConfig.length === 0 && editingBucketIndex === -1);
  if (editingBucketIndex === -1) {
    var newBucket = {
      id: newData.id,
      name: newData.name,
      endpoint: newData.endpoint,
      accessKeyId: newData.accessKeyId,
      secretAccessKey: newData.secretAccessKey || '',
      apiToken: newData.apiToken || '',
      publicDomain: newData.publicDomain || '',
      accountId: newData.accountId || '',
      hasSecret: newData.secretAccessKey ? true : false,
      hasToken: newData.apiToken ? true : false,
      isDefault: isFirstBucket ? true : false
    };
    bucketsConfig.push(newBucket);
  } else {
    var oldBucket = bucketsConfig[editingBucketIndex];
    var updatedBucket = {
      ...oldBucket,
      id: newData.id,
      name: newData.name,
      endpoint: newData.endpoint,
      accessKeyId: newData.accessKeyId,
      publicDomain: newData.publicDomain || '',
      accountId: newData.accountId || '',
      secretAccessKey: newData.secretAccessKey ? newData.secretAccessKey : oldBucket.secretAccessKey,
      apiToken: newData.apiToken ? newData.apiToken : oldBucket.apiToken,
      hasSecret: newData.secretAccessKey ? true : oldBucket.hasSecret,
      hasToken: newData.apiToken ? true : oldBucket.hasToken
    };
    bucketsConfig[editingBucketIndex] = updatedBucket;
  }
  try {
    var res = await fetchWithCreds('/admin/buckets', {
      method: 'POST',
      body: JSON.stringify({ data: bucketsConfig })
    });
    var json = await res.json();
    if (json.code === 200) {
      showToast(t('toastSaveBucketSuccess'));
      bucketSizes = {};
      await fetchAllBucketUsages();
      renderBucketOptions();
      if (currentBucketId && bucketsConfig.some(function(b) { return b.id === currentBucketId; })) {
        updateBucketSelectLabel();
      }
      showBucketList();
    } else {
      showToast(t('toastSaveBucketFail', translateBackendMsg(json.msg)));
    }
  } catch (e) {
    showToast(t('toastSaveBucketFail', e.message));
  }
}

function detectOS(ua) {
  if (/Windows/i.test(ua)) return 'windows';
  if (/iPhone|iPad|iPod|Macintosh|Mac OS X/i.test(ua)) return 'apple';
  if (/Android/i.test(ua)) return 'android';
  return 'other';
}

function getOSIcon(ua) {
  var os = detectOS(ua);
  if (os === 'windows') {

// ---------- 文件列表 ----------
// 修复：允许传入空字符串表示根目录
function getFileList(path) {
  var targetPath = (path !== undefined) ? path : currentPath;
  if (!currentBucketId) {
    document.getElementById('fileList').innerHTML = '<tr><td colspan="4">' + t('toastBucketRequired') + '</td></tr>';
    return;
  }
  currentPath = targetPath;
  var statusDom = document.getElementById('status');
  var listDom = document.getElementById('fileList');
  statusDom.innerText = t('loading');
  selectedKeys.clear();
  updateBatchDelButton();
  listDom.classList.add('fade-out');
  setTimeout(async function() {
    try {
      var res = await fetchWithCreds('/list?path=' + encodeURIComponent(targetPath) + '&bucketId=' + currentBucketId);
      var json = await res.json();
      listDom.innerHTML = '';
      renderBread(targetPath);
      currentFilesList = json.files.map(function(f) { return { name: f.name, url: f.url, fullKey: f.fullKey, downloadUrl: f.downloadUrl || '' }; });
      json.folders.forEach(function(item) {
        var tr = document.createElement('tr');
        var folderName = item.name.replace('/', '');
        tr.setAttribute('data-key', item.path);
        tr.addEventListener('click', handleRowClick);
        tr.innerHTML = 
          '<td><a onclick="event.stopPropagation(); openFolder(\'' + item.path + '\')" style="cursor:pointer;">📁 ' + escapeHtml(folderName) + '</a></td>' +
          '<td>—</td><td>—</td>' +
          '<td><button class="copy-btn" onclick="event.stopPropagation(); openRename(\'' + encodeURIComponent(item.path) + '\', \'' + escapeHtml(folderName) + '\')">' + t('rename') + '</button><button class="del-btn" onclick="event.stopPropagation(); delItem(\'' + item.path + '\')">' + t('delete') + '</button></td>';
        listDom.appendChild(tr);
      });
      json.files.forEach(function(item) {
        var tr = document.createElement('tr');
        var size = formatSize(item.size);
        var time = new Date(item.uploadTime).toLocaleString();
        var ext = item.name.split('.').pop().toLowerCase();
        var isTextFile = ['js','css','html','txt','json','md','xml','yml','yaml','ini','conf','log','csv'].indexOf(ext) !== -1;
        tr.setAttribute('data-key', item.fullKey);
        tr.addEventListener('click', handleRowClick);
        var actions = '';
        if (item.url) actions += '<a href="' + item.url + '" target="_blank" onclick="event.stopPropagation();">' + t('preview') + '</a>';
        actions += '<button class="copy-btn" onclick="event.stopPropagation(); downloadFile(\'' + item.downloadUrl + '\')">' + t('download') + '</button>';
        actions += '<button class="copy-btn" onclick="event.stopPropagation(); copyLink(\'' + item.url + '\', \'' + escapeHtml(item.name) + '\')">' + t('copyLink') + '</button>';
        if (isTextFile) actions += '<button class="copy-btn" onclick="event.stopPropagation(); openEditor(\'' + encodeURIComponent(item.fullKey) + '\', \'' + escapeHtml(item.name) + '\')">' + t('edit') + '</button>';
        actions += '<button class="del-btn" onclick="event.stopPropagation(); delItem(\'' + item.fullKey + '\')">' + t('delete') + '</button>';
        tr.innerHTML = 
          '<td><span onclick="event.stopPropagation(); openRename(\'' + encodeURIComponent(item.fullKey) + '\', \'' + escapeHtml(item.name) + '\')" style="cursor:pointer;">📄 ' + escapeHtml(item.name) + '</span></td>' +
          '<td>' + size + '</td><td>' + time + '</td>' +
          '<td>' + actions + '</td>';
        listDom.appendChild(tr);
      });
      if (json.folders.length + json.files.length === 0) {
        listDom.innerHTML = "<tr class='empty-row'><td colspan='4'>" + t('emptyFolder') + "</td></tr>";
      }
      statusDom.innerText = t('statusFolderCount', json.folders.length, json.files.length);
    } catch (e) {
      statusDom.innerText = t('loading') + ' ' + e.message;
      showToast(t('toastReadFail', e.message));
    } finally {
      listDom.classList.remove('fade-out');
    }
  }, 200);
}

function openFolder(fullPath) { getFileList(fullPath); }

// ---------- 行选中 ----------
function handleRowClick(e) {
  var tr = e.currentTarget;
  var key = tr.getAttribute('data-key');
  if (!key) return;
  if (selectedKeys.has(key)) {
    selectedKeys.delete(key);
    tr.classList.remove('selected');
  } else {
    selectedKeys.add(key);
    tr.classList.add('selected');
  }
  updateBatchDelButton();
}

function updateBatchDelButton() {
  var btn = document.getElementById('batchDelBtn');
  if (selectedKeys.size > 0) {
    btn.disabled = false;
    btn.classList.add('active');
  } else {
    btn.disabled = true;
    btn.classList.remove('active');
  }
}

// ---------- 新建文件夹 ----------
function openNewFolderModal() {
  document.getElementById('newFolderInput').value = '';
  document.getElementById('newFolderModal').classList.add('active');
  document.getElementById('newFolderInput').focus();
}

function closeNewFolderModal() {
  document.getElementById('newFolderModal').classList.remove('active');
}

async function submitNewFolder() {
  var dirName = document.getElementById('newFolderInput').value.trim();
  if (!dirName) { showToast(t('toastFolderNameRequired')); return; }
  var fullDir = currentPath + dirName;
  try {

    });

    showToast(t('toastCreateFolderFail', e.message));

// ---------- 上传 ----------
async function uploadFiles() {
  var fileInput = document.getElementById('fileInp');
  var files = Array.from(fileInput.files);
  if (files.length === 0) { showToast(t('toastNoFile')); return; }
  var container = document.getElementById('uploadProgressContainer');
  container.innerHTML = '';
  container.style.display = 'flex';
  var progressItems = [];
  for (var i = 0; i < files.length; i++) {
    var file = files[i];
    var itemDiv = document.createElement('div');
    itemDiv.className = 'progress-item';
    itemDiv.setAttribute('data-index', i);
    itemDiv.innerHTML = 
      '<div class="upload-status-icon"><span class="pulse-dot"></span></div>' +
      '<div class="file-label" title="' + escapeHtml(file.name) + '">' + escapeHtml(file.name) + '</div>' +
      '<div class="progress-bar-bg"><div class="progress-bar-fill uploading" style="width:0%"></div></div>' +
      '<div class="progress-percent">0%</div>';
    container.appendChild(itemDiv);
    progressItems.push({
      div: itemDiv,
      fill: itemDiv.querySelector('.progress-bar-fill'),
      percentSpan: itemDiv.querySelector('.progress-percent'),
      file: file
    });
  }
  var completed = 0, failed = 0;
  var statusDom = document.getElementById('status');
  var CONCURRENCY = 3;
  var queue = progressItems.slice();
  async function uploadOne(item) {
    var file = item.file;
    var fill = item.fill;
    var percentSpan = item.percentSpan;
    var div = item.div;
    var xhr = new XMLHttpRequest();
    var fd = new FormData();
    fd.append('file', file);
    return new Promise(function(resolve) {
      xhr.upload.onprogress = function(e) {
        if (e.lengthComputable) {
          var percent = Math.round((e.loaded / e.total) * 100);
          fill.style.width = percent + '%';
          percentSpan.innerText = percent + '%';
          if (percent === 100) fill.classList.remove('uploading');
        }
      };
      xhr.onload = function() {
        if (xhr.status === 200) {
          div.querySelector('.upload-status-icon').innerHTML = '✅';
          completed++;
        } else {
          div.querySelector('.upload-status-icon').innerHTML = '❌';
          fill.style.background = 'var(--btn-danger)';
          failed++;
        }
        resolve();
      };
      xhr.onerror = function() {
        div.querySelector('.upload-status-icon').innerHTML = '❌';
        fill.style.background = 'var(--btn-danger)';
        failed++;
        resolve();
      };
      xhr.open('POST', '/upload?path=' + encodeURIComponent(currentPath) + '&bucketId=' + currentBucketId);
      xhr.withCredentials = true;
      xhr.send(fd);
    });
  }
  async function processNext() {
    while (queue.length) {
      var item = queue.shift();
      await uploadOne(item);
      statusDom.innerText = t('statusUploading', completed, progressItems.length, failed);
    }
  }
  var workers = [];
  for (var j = 0; j < Math.min(CONCURRENCY, queue.length); j++) {
    workers.push(processNext());
  }
  await Promise.all(workers);
  statusDom.innerText = t('statusUploadDone', completed, failed);
  showToast(t('toastUploadSuccess', completed));
  setTimeout(function() {
    getFileList();
    setTimeout(function() { container.style.display = 'none'; }, 2000);
  }, 500);
}

// ---------- 删除 ----------
async function delItem(fullKey) {
  var isFolder = fullKey.endsWith('/');
  var displayName = isFolder ? fullKey.slice(0, -1).split('/').pop() : fullKey.split('/').pop();
  if (!confirm(t('toastDeleteItemConfirm', displayName))) return;
  try {
    var res = await fetchWithCreds('/del?key=' + encodeURIComponent(fullKey) + '&bucketId=' + currentBucketId, {
      method: 'DELETE'
    });
    if (res.ok) {
      showToast(t('toastDeleteSuccess'));
      getFileList();
    } else {
      var json = await res.json();
      showToast(t('toastDeleteFail', translateBackendMsg(json.msg) || res.status));
    }
  } catch (e) {
    showToast(t('toastDeleteFail', e.message));
  }
}

// ---------- 批量删除 ----------
async function batchDelete() {
  if (selectedKeys.size === 0) return;
  var keys = Array.from(selectedKeys);
  var displayNames = keys.map(function(k) {
    if (k.endsWith('/')) {
      return k.slice(0, -1).split('/').pop();
    } else {
      return k.split('/').pop();
    }
  });
  if (!confirm(t('toastBatchDeleteConfirm', keys.length, displayNames.join('\n')))) return;
  try {
    var res = await fetchWithCreds('/del-batch?bucketId=' + currentBucketId, {
      method: 'POST',
      body: JSON.stringify({ keys: keys })
    });
    var json = await res.json();
    if (json.code === 200) {
      showToast(t('toastBatchDeleteSuccess', json.deletedCount || keys.length));
      selectedKeys.clear();
      updateBatchDelButton();
      getFileList();
    } else {
      showToast(t('toastBatchDeleteFail', translateBackendMsg(json.msg) || res.status));
    }
  } catch (e) {
    showToast(t('toastBatchDeleteFail', e.message));
  }
}

// ---------- 复制链接 ----------
function copyLink(url, fileName) {
  if (!url) { showToast(t('toastNoPublicDomain')); return; }
  navigator.clipboard.writeText(url).then(function() {
    showToast(t('toastCopySuccess', fileName));
  }).catch(function() {
    showToast(t('toastCopyFail'));
  });
}

// ---------- 下载 ----------
function downloadFile(downloadUrl) {
  if (!downloadUrl) { showToast(t('toastDownloadInvalid')); return; }
  showToast(t('toastDownloadWait'));
  var a = document.createElement('a');
  a.href = downloadUrl;
  document.body.appendChild(a);
  a.click();
  a.remove();
}

// ---------- 编辑器 ----------
function openEditor(encodedKey, fileName) {
  currentEditKey = decodeURIComponent(encodedKey);
  document.getElementById('editorFileName').innerText = fileName;
  document.getElementById('editorModal').classList.add('active');
  var textarea = document.getElementById('editorContent');
  textarea.value = t('loading');
  fetchWithCreds('/read?key=' + encodedKey + '&bucketId=' + currentBucketId)
    .then(function(res) {
      if (!res.ok) throw new Error(t('toastReadFail', res.status));
      return res.json();
    })
    .then(function(json) { textarea.value = json.content; })
    .catch(function(e) {
      textarea.value = '';
      showToast(t('toastReadFail', e.message));
    });
}
function closeEditor() {
  document.getElementById('editorModal').classList.remove('active');
  currentEditKey = '';
}
async function saveEditor() {
  if (!currentEditKey) return;
  var content = document.getElementById('editorContent').value;
  try {
    var res = await fetchWithCreds('/write?key=' + encodeURIComponent(currentEditKey) + '&bucketId=' + currentBucketId, {
      method: 'PUT',
      body: JSON.stringify({ content: content })
    });
    var json = await res.json();
    if (json.code === 200) {
      showToast(t('toastSaveSuccess'));
      closeEditor();
      getFileList();
    } else {
      showToast(t('toastSaveFail', translateBackendMsg(json.msg)));
    }
  } catch (e) {
    showToast(t('toastSaveFail', e.message));
  }
}

// ---------- 重命名 ----------
function openRename(encodedKey, oldName) {
  currentRenameKey = decodeURIComponent(encodedKey);
  document.getElementById('renameOldName').innerText = oldName;
  // 确保当前名称标签已翻译
  var renameP = document.querySelector('#renameModal p');
  if (renameP) {
    var textNode = renameP.childNodes[0];
    if (textNode && textNode.nodeType === 3 && textNode.textContent.trim() === '当前名称：') {
      textNode.textContent = t('renameCurrentName');
    }
  }
  document.getElementById('renameInput').value = oldName;
  document.getElementById('renameModal').classList.add('active');
  document.getElementById('renameInput').focus();
  document.getElementById('renameInput').select();
}
function openRenameFromEditor() {
  if (!currentEditKey) return;
  var fileName = currentEditKey.split('/').pop();
  openRename(encodeURIComponent(currentEditKey), fileName);
}
function closeRename() {
  document.getElementById('renameModal').classList.remove('active');
  currentRenameKey = '';
}
async function submitRename() {
  if (!currentRenameKey) return;
  var oldKey = currentRenameKey;
  var newName = document.getElementById('renameInput').value.trim();
  if (!newName) { showToast(t('toastRenameNewNameRequired')); return; }
  if (newName.indexOf('/') !== -1) { showToast(t('toastRenameSlashNotAllowed')); return; }
  try {
    var res = await fetchWithCreds('/rename?oldKey=' + encodeURIComponent(oldKey) + '&newName=' + encodeURIComponent(newName) + '&bucketId=' + currentBucketId, {
      method: 'POST'
    });
    var json = await res.json();
    if (json.code === 200) {
      showToast(t('toastRenameSuccess'));
      if (currentEditKey && currentEditKey === oldKey) {
        var lastSlashIndex = oldKey.lastIndexOf('/');
        var dirPath = lastSlashIndex >= 0 ? oldKey.substring(0, lastSlashIndex + 1) : '';
        currentEditKey = dirPath + newName;
        document.getElementById('editorFileName').innerText = newName;
      }
      closeRename();
      getFileList();
    } else {
      showToast(t('toastRenameFail', translateBackendMsg(json.msg) || res.status));
    }
  } catch (e) {
    showToast(t('toastRenameFail', e.message));
  }
}

// ---------- 导出链接 ----------
function exportAllLinks() {
  if (currentFilesList.length === 0) {
    showToast(t('toastNoFilesExport'));
    return;
  }
  var text = "文件名\t文件链接\n";
  currentFilesList.forEach(function(f) {
    text += f.name + '\t' + (f.url || t('toastNoPublicDomain')) + '\n';
  });
  navigator.clipboard.writeText(text).then(function() {
    showToast(t('toastExportSuccess', currentFilesList.length));
  }).catch(function() {
    showToast(t('toastExportFail'));
  });
}

// ========== 页面加载 ==========
window.onload = async function() {
  applyTranslations();
  var loadingOverlay = document.getElementById('loadingOverlay');
  loadingOverlay.style.display = 'flex';
  try {
    var statusRes = await fetch('/admin/password-status');
    var statusJson = await statusRes.json();
    if (!statusJson.set) {
      document.getElementById('loginBox').style.display = 'flex';
      document.getElementById('loginTitle').innerText = t('initPwdTitle');
      document.getElementById('pwdInput').placeholder = t('initPwdPlaceholder');
      document.getElementById('loginBtn').innerText = t('initPwdBtnText');
      document.getElementById('loginBtn').onclick = initPassword;
      document.getElementById('initPwdBtn').style.display = 'none';
      document.getElementById('loginTip').innerText = '';
      document.getElementById('mainBox').style.display = 'none';
      loadingOverlay.classList.add('fade-out');
      setTimeout(function() { loadingOverlay.style.display = 'none'; }, 400);
      return;
    }
    var res = await fetchWithCreds('/admin/buckets');
    if (res.status === 401) {
      loadingOverlay.classList.add('fade-out');
      setTimeout(function() { loadingOverlay.style.display = 'none'; }, 400);
      return;
    }
    var json = await res.json();
    if (json.code === 200) {
      document.getElementById('loginBox').style.display = 'none';
      var mainBox = document.getElementById('mainBox');
      mainBox.style.display = 'block';
      void mainBox.offsetWidth;
      mainBox.classList.add('visible');
      await loadBuckets();
      fetchWithCreds('/admin/update-session', { method: 'POST' }).catch(function() {});
    }
  } catch (e) {
    console.warn('自动登录检查失败，请手动登录', e);
  } finally {
    loadingOverlay.classList.add('fade-out');
    setTimeout(function() {
      loadingOverlay.style.display = 'none';
    }, 400);
  }
};
